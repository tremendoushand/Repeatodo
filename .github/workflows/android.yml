name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee debug.log

      # The debug key is fixed, so this fingerprint should be the same on every run.
      - name: Show debug signing certificate
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -m1 "SHA-256")
          echo "::notice::Debug APK $CERT"

      # Optional: with the signing secrets set (see docs/PLAY_STORE_GUIDE.md), release builds are signed
      # with your own key, so Google Drive sign-in works and the AAB can go straight to Play Console.
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.REPEATODO_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "REPEATODO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and AAB (checks shrinking and lint)
        env:
          REPEATODO_KEYSTORE_PASSWORD: ${{ secrets.REPEATODO_KEYSTORE_PASSWORD }}
          REPEATODO_KEY_ALIAS: ${{ secrets.REPEATODO_KEY_ALIAS }}
          REPEATODO_KEY_PASSWORD: ${{ secrets.REPEATODO_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --stacktrace 2>&1 | tee release.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: repeatodo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release builds
        uses: actions/upload-artifact@v4
        with:
          name: repeatodo-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      # Surface the key error lines as annotations so they show on the run summary page.
      - name: Summarize errors
        if: failure()
        run: |
          cat test.log debug.log release.log 2>/dev/null \
            | grep -E "^e: |error:|Error:|What went wrong|FAILED|Missing class|Exception|expected:|\.kt:[0-9]+|\.xml:[0-9]+" \
            | grep -vE "^\s*at |^> Task" | head -10 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
