name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Optional: with the signing secrets set (see docs/PLAY_STORE_GUIDE.md), release builds are signed
      # with your own key, so Google Drive sign-in works and the AAB can go straight to Play Console.
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.REPEATODO_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "REPEATODO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and AAB (checks shrinking and lint)
        env:
          REPEATODO_KEYSTORE_PASSWORD: ${{ secrets.REPEATODO_KEYSTORE_PASSWORD }}
          REPEATODO_KEY_ALIAS: ${{ secrets.REPEATODO_KEY_ALIAS }}
          REPEATODO_KEY_PASSWORD: ${{ secrets.REPEATODO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: repeatodo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release builds
        uses: actions/upload-artifact@v4
        with:
          name: repeatodo-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
